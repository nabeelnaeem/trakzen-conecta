[package]
name = "trakzen-conecta"
version = "0.3.0"
description = "Lightweight desktop mail client and LAN chat"
authors = ["Nabeel Naeem"]
license = "MIT"
repository = "https://github.com/nabeelnaeem/trakzen-conecta"
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "trakzen_conecta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
mdns-sd = "0.13"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures = "0.3"

rusqlite = { version = "0.32", features = ["bundled", "serde_json", "functions"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2"
async-trait = "0.1"

lettre = { version = "0.11", default-features = false, features = ["builder"] }
ammonia = "4"
html2text = "0.13"
local-ip-address = "0.6"
mime_guess = "2"
sanitize-filename = "0.5"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
